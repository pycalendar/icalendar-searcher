repos:
 - repo: https://github.com/astral-sh/ruff-pre-commit
   # Ruff version.
   rev: v0.14.5
   hooks:
    # Run the linter with auto-fix on commit
    - id: ruff
      args:
       - "--fix"
      stages: [pre-commit]
    # Run the formatter on commit
    - id: ruff-format
      stages: [pre-commit]

 - repo: https://github.com/pre-commit/pre-commit-hooks
   rev: v6.0.0
   hooks:
    - id: trailing-whitespace
      stages: [pre-commit]
    - id: end-of-file-fixer
      stages: [pre-commit]
    - id: check-yaml
      stages: [pre-commit]
    - id: check-toml
      stages: [pre-commit]
    - id: check-ast
      stages: [pre-commit]
    - id: mixed-line-ending
      args: [--fix=lf]
      stages: [pre-commit]

 - repo: local
   hooks:
    # Run ruff check without fixes on push (to catch any issues)
    - id: ruff-check-push
      name: Ruff check (no fixes)
      entry: ruff check
      language: system
      types: [python]
      pass_filenames: false
      stages: [pre-push]
    # Run full test suite on push
    - id: pytest-push
      name: Run pytest
      entry: pytest
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]

 - repo: https://github.com/lycheeverse/lychee
   rev: lychee-v0.24.2
   hooks:
    - id: lychee
      # Check links across the whole working tree (all file types, not just
      # md/rst).  pass_filenames: false -> pre-commit passes only '.', so the
      # whole repo is scanned rather than just the changed files.
      args: ["--no-progress", "--timeout", "10", "--cache", "--max-cache-age", "1d", "."]
      pass_filenames: false
      stages: [pre-push]
